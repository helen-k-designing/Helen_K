<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
       <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="apple-touch-icon" sizes="180×180" href="./apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32×32" href="./favicon-32×32.png">
    <link rel="icon" type="image/png" sizes="16×16" href="./favicon-16×16.png">
    <link rel="stylesheet" href="css/card.css">
    <title>Document</title>
</head>
<body>
    
<!-- Блок -->
<div class="product-card">
<!-- Елемент -->
<img src="/logo.png" alt="Товар" class="product-card__image">
<!-- Елемент -->
<h3 class="product-card__title">Смартфон Galaxy</h3>
<!-- Елемент з Модифікатором (акційна ціна) -->
<span class="product-card__price product-card__price--discount">$799</span>
<!-- Елемент-кнопка з Модифікатором (заблокована) -->
<button class="product-card__button product-card__button--disabled" disabled>
Немає в наявності
</button>
</div>

<div class="grid-container">
<div><img src="images/cat1.jpg"></div>
<div><img src="images/cat2.jpg"></div>
<div><img src="images/cat3.jpg"></div>
<div><img src="images/cat4.jpg"></div>
<div><img src="images/cat5.jpg"></div>
<div><img src="images/cat1.jpg"></div>
</div>

</body>
</html>
