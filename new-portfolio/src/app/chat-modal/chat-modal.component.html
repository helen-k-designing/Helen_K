<div class="chat-backdrop" (click)="onClose()">
  <div class="chat-window" (click)="$event.stopPropagation()">
    
    <!-- Шапка чату -->
    <div class="chat-header">
      <div class="chat-studio-info">
        <div class="status-dot"></div>
        <div>
          <h3>PORTFOLIO</h3>
          <span>Онлайн-асистент</span>
        </div>
      </div>
      <button class="chat-close-btn" (click)="onClose()" aria-label="Закрити чат">✕</button>
    </div>

    <!-- Стрічка повідомлень -->
    <div class="chat-messages" #scrollContainer>
      @for (msg of messages(); track $index) {
        <div class="message-bubble" [class.user]="msg.sender === 'user'" [class.studio]="msg.sender === 'studio'">
          
          <!-- Якщо це повідомлення від користувача, показуємо ім'я, контакти та текст окремо -->
          @if (msg.sender === 'user' && msg.name) {
            <div class="msg-user-details">
              <strong>Ім'я:</strong> {{ msg.name }}<br>
              <strong>Email:</strong> {{ msg.contact }}<br><br>
            </div>
          }

          <!-- Сам текст повідомлення -->
          <div class="msg-text">{{ msg.text }}</div>
          
          <span class="msg-time">{{ msg.time }}</span>
        </div>
      }
    </div>

    <!-- Форма контактів та введення повідомлення -->
    <form class="chat-form" (ngSubmit)="sendMessage()">
      <div class="contact-setup">
        <input 
          type="text" 
          placeholder="Твоє ім'я *" 
          [ngModel]="userName()" 
          (ngModelChange)="userName.set($event); onFieldInput()" 
          name="userName"
          autocomplete="off"
          spellcheck="false"
          required
          [class.input-error]="showValidationError() && !userName().trim()"
          [class.has-value]="userName().trim().length > 0"
          class="chat-input"
        />

        <input 
          type="email" 
          placeholder="Твій email *" 
          [ngModel]="userContact()" 
          (ngModelChange)="userContact.set($event); onFieldInput()" 
          name="userContact"
          autocomplete="email"
          spellcheck="false"
          required
          [class.input-error]="showValidationError() && !userContact().trim()"
          [class.has-value]="userContact().trim().length > 0"
          class="chat-input"
        />

        @if (showValidationError()) {
          <p class="validation-hint">
            Будь ласка, заповни ім’я та email, щоб я могла тобі відповісти
          </p>
        }
      </div>

      <!-- Поле для запитання -->
      <div class="message-input-row">
        <textarea 
          placeholder="Напиши своє запитання..." 
          [ngModel]="currentMessage()" 
          (ngModelChange)="currentMessage.set($event)" 
          name="currentMessage"
          autocomplete="off"
          //spellcheck="false"
          required
          rows="3"
          class="chat-input chat-textarea msg-field">
        </textarea>
        
        <button type="submit" class="send-btn" [disabled]="isSending() || !currentMessage().trim()" title="Надіслати">
          ➤
        </button>
      </div>

      <!-- Месенджери у футері чату -->
      <div class="chat-footer-messengers">
        <a [href]="whatsappUrl" target="_blank" rel="noopener" class="messenger-icon-link" title="WhatsApp">
          <svg viewBox="0 0 24 24"><path d="M12.04 2c-5.46 0-9.91 4.45-9.91 9.91 0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38c1.45.79 3.08 1.21 4.74 1.21 5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01C17.18 3.03 14.69 2 12.04 2zM12.04 20.1c-1.42 0-2.81-.38-4.03-1.09l-.29-.17-3.03.8.81-2.95-.19-.31c-.79-1.28-1.21-2.77-1.21-4.29 0-4.49 3.65-8.14 8.14-8.14 2.18 0 4.23.85 5.77 2.39 1.54 1.54 2.39 3.59 2.39 5.77 0 4.49-3.65 8.14-8.14 8.14zm4.46-6.1c-.24-.12-1.42-.7-1.64-.78-.22-.08-.38-.12-.54.12-.16.24-.62.78-.76.94-.14.16-.28.18-.52.06-.24-.12-1.01-.37-1.92-1.18-.71-.63-1.19-1.41-1.33-1.65-.14-.24-.01-.37.1-.49.1-.1.24-.26.36-.39.12-.13.16-.22.24-.37.08-.15.04-.28-.02-.4-.06-.12-.54-1.31-.74-1.8-.2-.48-.4-.42-.54-.43h-.46c-.16 0-.42.06-.64.3-.22.24-.84.82-.84 2 0 1.18.86 2.33.98 2.49.12.16 1.69 2.58 4.1 3.62.57.25 1.02.4 1.37.51.58.18 1.11.15 1.53.09.47-.07 1.42-.58 1.62-1.14.2-.56.2-1.04.14-1.14-.06-.1-.22-.16-.46-.28z"/></svg>
        </a>
        <a [href]="signalUrl" target="_blank" rel="noopener" class="messenger-icon-link" title="Signal">
          <svg viewBox="0 0 24 24"><path d="M19.34 11.23c-.35-2.52-2.11-4.66-4.57-5.35-2.46-.69-5.1.18-6.66 2.22-1.56 2.04-1.74 4.83-.46 7.05l-1.43 1.43c-.39.39-.39 1.02 0 1.41.39.39 1.02.39 1.41 0l1.43-1.43c2.22 1.28 5.01 1.1 7.05-.46 2.04-1.56 2.91-4.2 2.22-6.66-.2-.73-.55-1.42-.99-2.01zm-7.34 4.77c-2.21 0-4-1.79-4-4s1.79-4 4-4 4 1.79 4 4-1.79 4-4 4 z"/></svg>
        </a>
      </div>
    </form>

  </div>
</div>
